name: "Quality aggregate & score"
description: "Aggregates tool outputs (flake8, mypy, bandit, radon, Trivy) into JSON/Markdown and exposes pass/fail."
author: "Ashutosh"

inputs:
  QUALITY_THRESHOLD:
    description: "Minimum score to pass"
    default: "35"
    required: false

  TRIVY_WEIGHT:
    description: "Weight per Trivy finding"
    default: "3"
    required: false

  # Backward-compatibility (deprecated):
  CHECKOV_WEIGHT:
    description: "DEPRECATED: Use TRIVY_WEIGHT instead."
    default: "3"
    required: false

outputs:
  score:
    description: "Computed quality score"
    value: ${{ steps.run-score.outputs.score }}
  threshold:
    description: "Threshold used for pass/fail"
    value: ${{ steps.run-score.outputs.threshold }}
  passed:
    description: "true/false"
    value: ${{ steps.run-score.outputs.passed }}

runs:
  using: "composite"
  steps:
    - name: Run quality_score.py
      id: run-score
      shell: bash
      env:
        QUALITY_THRESHOLD: ${{ inputs.QUALITY_THRESHOLD }}

        # Prefer TRIVY_WEIGHT; keep CHECKOV_WEIGHT for legacy callers
        TRIVY_WEIGHT: ${{ inputs.TRIVY_WEIGHT }}
        CHECKOV_WEIGHT: ${{ inputs.CHECKOV_WEIGHT }}
      run: |
        mkdir -p outputs
        python "${{ github.action_path }}/quality_score.py"

        # Re-expose outputs (script writes to $GITHUB_OUTPUT; this is defensive)
        score=$(grep -E '^score=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2)
        thresh=$(grep -E '^threshold=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2)
        passed=$(grep -E '^passed=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2)
        {
          echo "score=${score}"
          echo "threshold=${thresh}"
          echo "passed=${passed}"
        } >> "$GITHUB_OUTPUT"

    - name: Attach summary to job
      shell: bash
      run: |
        if [ -f outputs/quality_summary.md ]; then
          cat outputs/quality_summary.md >> "$GITHUB_STEP_SUMMARY"
        fi