name: "Quality aggregate & score"
description: "Aggregates tool outputs (flake8, mypy, bandit, radon, PSRule for Azure) into JSON/Markdown and exposes pass/fail."
author: "Ashutosh"

inputs:
  QUALITY_THRESHOLD:
    description: "Minimum score to pass"
    default: "35"
    required: false
  # FAIL_ON_SYNTAX_ERROR:
  #   description: "Hard-fail (score=0) if syntax compile failed"
  #   default: "true"
  #   required: false
  PSRULE_HIGH_WEIGHT:
    description: "Weight per PSRule ERROR-level finding"
    default: "8"
    required: false
  PSRULE_MED_WEIGHT:
    description: "Weight per PSRule WARNING-level finding"
    default: "3"
    required: false

outputs:
  score:
    description: "Computed quality score"
    value: ${{ steps.run-score.outputs.score }}
  threshold:
    description: "Threshold used for pass/fail"
    value: ${{ steps.run-score.outputs.threshold }}
  passed:
    description: "true/false"
    value: ${{ steps.run-score.outputs.passed }}

runs:
  using: "composite"
  steps:
    - name: Run quality_score.py
      id: run-score
      shell: bash
      env:
        QUALITY_THRESHOLD: ${{ inputs.QUALITY_THRESHOLD }}
        # FAIL_ON_SYNTAX_ERROR: ${{ inputs.FAIL_ON_SYNTAX_ERROR }}
        PSRULE_HIGH_WEIGHT: ${{ inputs.PSRULE_HIGH_WEIGHT }}
        PSRULE_MED_WEIGHT: ${{ inputs.PSRULE_MED_WEIGHT }}
      run: |
        mkdir -p outputs
        python "${{ github.action_path }}/quality_score.py"

        # Re-expose outputs (script writes to $GITHUB_OUTPUT; this is defensive)
        score=$(grep -E '^score=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2)
        thresh=$(grep -E '^threshold=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2)
        passed=$(grep -E '^passed=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2)
        {
          echo "score=${score}"
          echo "threshold=${thresh}"
          echo "passed=${passed}"
        } >> "$GITHUB_OUTPUT"

    - name: Attach summary to job
      shell: bash
      run: |
        if [ -f outputs/quality_summary.md ]; then
          cat outputs/quality_summary.md >> "$GITHUB_STEP_SUMMARY"
        fi