name: Python Code Quality Checker

on:
  pull_request:
    branches: [ main, dev, demo, test ]
  push:
    branches: [ main, dev, demo, test ]

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_quality:
    name: Python – lint, types, security, complexity (collect outputs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install \
            flake8 flake8-bugbear flake8-builtins pep8-naming flake8-blind-except flake8-json \
            mypy bandit radon

      - name: Prepare outputs dir
        run: mkdir -p outputs

      - name: Syntax check (compile) → outputs/syntax.json
        shell: bash
        run: |
          set +e
          pyfiles=$(git ls-files '*.py' || true)
          if [ -n "$pyfiles" ]; then
            python -m py_compile $pyfiles
            status=$?
            if [ $status -eq 0 ]; then
              echo '{"passed": true}' > outputs/syntax.json
            else
              echo '{"passed": false}' > outputs/syntax.json
            fi
          else
            echo '{"passed": true, "note":"No Python files detected"}' > outputs/syntax.json
          fi

      - name: Flake8 (style, naming, exceptions) → outputs/flake8.json
        run: |
          flake8 . --format=json --tee --output-file outputs/flake8.json || true

      - name: Mypy (types) → outputs/mypy.json
        run: |
          mypy --install-types --non-interactive --error-format=json . > outputs/mypy.json || true

      - name: Bandit (security) → outputs/bandit.json
        run: |
          bandit -r . -q -x tests -f json -o outputs/bandit.json || true

      - name: Radon (complexity JSON) → outputs/radon_cc.json
        run: |
          radon cc . -j > outputs/radon_cc.json || true

      - name: Upload Python outputs
        uses: actions/upload-artifact@v4
        with:
          name: python_outputs
          path: outputs


  trivy:
    name: IaC security (Trivy container) → outputs/trivy.json + SARIF
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Prepare outputs dir
        run: mkdir -p outputs

      # Trivy via official container image (avoids GitHub release binary install issues)
      # Pin a version you trust; update as needed.
      - name: Run Trivy (IaC/config) → SARIF (container)
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            aquasec/trivy:0.69.2 \
            config . \
            --format sarif \
            --output outputs/trivy.sarif \
            --exit-code 0

      - name: Run Trivy (IaC/config) → JSON (container)
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            aquasec/trivy:0.69.2 \
            config . \
            --format json \
            --output outputs/trivy.json \
            --exit-code 0

      # - name: Upload SARIF to code scanning
      #   if: always()
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: outputs/trivy.sarif

      - name: Upload Trivy outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy_outputs
          path: outputs


  jira_create_tickets:
    name: Create Jira tickets for Trivy CRITICAL/HIGH
    runs-on: ubuntu-latest
    needs: [trivy]
    # Recommended: only create tickets on PRs to avoid duplicates on every push
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Download Trivy outputs
        uses: actions/download-artifact@v4
        with:
          name: trivy_outputs
          path: artifacts/trivy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create Jira issues (Summary=Trivy Title, Description=PrimaryURL)
        env:
          # Jira config
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_ISSUE_TYPE: ${{ secrets.JIRA_ISSUE_TYPE }}

          # Prefer Jira Data Center PAT
          JIRA_PAT: ${{ secrets.JIRA_PAT }}

          # Optional Jira Cloud fallback (if you are on Jira Cloud instead)
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request, urllib.parse

          # --- Locate Trivy JSON (downloaded artifact path can vary) ---
          candidates = [
            "artifacts/trivy/trivy.json",
            "artifacts/trivy/outputs/trivy.json",
          ]
          trivy_path = next((p for p in candidates if os.path.exists(p)), None)
          if not trivy_path:
            raise SystemExit("trivy.json not found in downloaded artifact.")

          base_url = os.environ["JIRA_BASE_URL"].rstrip("/")
          project_key = os.environ["JIRA_PROJECT_KEY"]
          issue_type = os.environ.get("JIRA_ISSUE_TYPE", "Task")

          email = os.environ.get("JIRA_EMAIL")
          api_token = os.environ.get("JIRA_API_TOKEN")
          pat = os.environ.get("JIRA_PAT")

          headers = {"Accept": "application/json", "Content-Type": "application/json"}

          # --- Auth selection: PAT (Data Center) preferred; else Cloud Basic ---
          if pat:
            headers["Authorization"] = f"Bearer {pat}"
            issue_endpoint = f"{base_url}/rest/api/2/issue"
            search_endpoint = f"{base_url}/rest/api/2/search"
            is_cloud = False
          elif email and api_token:
            token = base64.b64encode(f"{email}:{api_token}".encode("utf-8")).decode("ascii")
            headers["Authorization"] = f"Basic {token}"
            issue_endpoint = f"{base_url}/rest/api/3/issue"
            search_endpoint = f"{base_url}/rest/api/3/search"
            is_cloud = True
          else:
            raise SystemExit("Missing Jira auth. Provide JIRA_PAT (Data Center) or JIRA_EMAIL+JIRA_API_TOKEN (Cloud).")

          def http_json(url, method="GET", payload=None):
            data = None if payload is None else json.dumps(payload).encode("utf-8")
            req = urllib.request.Request(url, data=data, method=method, headers=headers)
            with urllib.request.urlopen(req) as resp:
              body = resp.read().decode("utf-8")
              return resp.status, (json.loads(body) if body.strip() else {})

          # --- Load Trivy results ---
          with open(trivy_path, "r", encoding="utf-8") as f:
            trivy = json.load(f)

          wanted = {"CRITICAL", "HIGH"}
          results = trivy.get("Results", []) if isinstance(trivy, dict) else []

          findings = []
          for r in results:
            for mc in (r.get("Misconfigurations") or []):
              sev = str(mc.get("Severity", "")).upper()
              if sev not in wanted:
                continue
              fid = mc.get("ID") or "TRIVY_UNKNOWN"
              title = (mc.get("Title") or fid).strip()
              primary = (mc.get("PrimaryURL") or "").strip()
              findings.append({"id": fid, "title": title, "severity": sev, "primary": primary})

          if not findings:
            print("No CRITICAL/HIGH misconfigurations found; no Jira tickets created.")
            raise SystemExit(0)

          # --- Dedupe (optional but recommended) ---
          # Avoid re-creating same finding across workflow reruns.
          def exists(title, fid):
            t = title.replace('"', '\\"')
            jql = f'project = "{project_key}" AND summary ~ "\\"{t}\\"" AND summary ~ "{fid}" AND statusCategory != Done'
            url = search_endpoint + "?" + urllib.parse.urlencode({"jql": jql, "maxResults": 1})
            _, data = http_json(url, "GET")
            return int(data.get("total", 0) or 0) > 0

          created = 0
          skipped = 0

          for fnd in findings:
            # Task name as you requested: Trivy issue title (fallback to ID)
            summary = fnd["title"] if fnd["title"] else fnd["id"]

            # Description as you requested: hyperlink/PrimaryURL
            description_text = fnd["primary"] or f"Trivy finding {fnd['id']} ({fnd['severity']}) has no PrimaryURL."

            if exists(summary, fnd["id"]):
              print(f"Skip (already exists): {summary} ({fnd['id']})")
              skipped += 1
              continue

            if is_cloud:
              # Jira Cloud uses Atlassian Document Format for textarea fields
              payload = {
                "fields": {
                  "project": {"key": project_key},
                  "issuetype": {"name": issue_type},
                  "summary": summary,
                  "description": {
                    "type": "doc",
                    "version": 1,
                    "content": [
                      {"type": "paragraph", "content": [{"type": "text", "text": description_text}]}
                    ],
                  },
                }
              }
            else:
              # Jira Server/DC generally accepts plain string description
              payload = {
                "fields": {
                  "project": {"key": project_key},
                  "issuetype": {"name": issue_type},
                  "summary": summary,
                  "description": description_text,
                }
              }

            _, data = http_json(issue_endpoint, "POST", payload)
            print("Created:", data.get("key", "(unknown)"), "-", summary)
            created += 1

          print(f"Done. Created={created}, Skipped={skipped}, TotalCandidates={len(findings)}")
          PY