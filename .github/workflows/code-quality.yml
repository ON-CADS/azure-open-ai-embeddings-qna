name: Python Code Quality Checker

on:
  pull_request:
    branches: [ main, dev, demo, test ]
  push:
    branches: [ main, dev, demo, test ]

permissions:
  contents: read
  actions: read

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_quality:
    name: Python – lint, types, security, complexity (collect outputs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install \
            flake8 flake8-bugbear flake8-builtins pep8-naming flake8-blind-except flake8-json \
            mypy bandit radon

      - name: Prepare outputs dir
        run: mkdir -p outputs

      - name: Syntax check (compile) → outputs/syntax.json
        shell: bash
        run: |
          set +e
          pyfiles=$(git ls-files '*.py' || true)
          if [ -n "$pyfiles" ]; then
            python -m py_compile $pyfiles
            status=$?
            if [ $status -eq 0 ]; then
              echo '{"passed": true}' > outputs/syntax.json
            else
              echo '{"passed": false}' > outputs/syntax.json
            fi
          else
            echo '{"passed": true, "note":"No Python files detected"}' > outputs/syntax.json
          fi

      - name: Flake8 (style, naming, exceptions) → outputs/flake8.json
        run: |
          flake8 . --format=json --tee --output-file outputs/flake8.json || true

      - name: Mypy (types) → outputs/mypy.json
        run: |
          mypy --install-types --non-interactive --error-format=json . > outputs/mypy.json || true

      - name: Bandit (security) → outputs/bandit.json
        run: |
          bandit -r . -q -x tests -f json -o outputs/bandit.json || true

      - name: Radon (complexity JSON) → outputs/radon_cc.json
        run: |
          radon cc . -j > outputs/radon_cc.json || true

      - name: Upload Python outputs
        uses: actions/upload-artifact@v4
        with:
          name: python_outputs
          path: outputs


  trivy:
    name: IaC security (Trivy container) → outputs/trivy.json
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Prepare outputs dir
        run: mkdir -p outputs

      - name: Run Trivy (IaC/config) → JSON (container)
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            aquasec/trivy:0.69.2 \
            config . \
            --format json \
            --output outputs/trivy.json \
            --exit-code 0

      - name: Upload Trivy outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy_outputs
          path: outputs


  jira_create_or_update_tickets:
    name: Jira upsert for Trivy CRITICAL/HIGH (runs on all commits)
    runs-on: [self-hosted, linux, jira]
    needs: [trivy]
    if: ${{ always() }}
    steps:
      - name: Download Trivy outputs
        uses: actions/download-artifact@v4
        with:
          name: trivy_outputs
          path: artifacts/trivy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create/Update Jira issues (overwrite description)
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_ISSUE_TYPE: ${{ secrets.JIRA_ISSUE_TYPE }}
          JIRA_PAT: ${{ secrets.JIRA_PAT }}

          # Optional Jira Cloud fallback
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          # Optional context (not required, but useful)
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request, urllib.parse

          # ---- Find trivy.json ----
          candidates = [
            "artifacts/trivy/trivy.json",
            "artifacts/trivy/outputs/trivy.json",
          ]
          trivy_path = next((p for p in candidates if os.path.exists(p)), None)
          if not trivy_path:
            raise SystemExit("trivy.json not found in downloaded artifact.")

          base_url = os.environ["JIRA_BASE_URL"].rstrip("/")
          project_key = os.environ["JIRA_PROJECT_KEY"]
          issue_type = os.environ.get("JIRA_ISSUE_TYPE", "Task")

          email = os.environ.get("JIRA_EMAIL")
          api_token = os.environ.get("JIRA_API_TOKEN")
          pat = os.environ.get("JIRA_PAT")

          repo = os.environ.get("GITHUB_REPO","")
          ref = os.environ.get("GITHUB_REF_NAME","")
          sha = os.environ.get("GITHUB_SHA","")
          run_url = os.environ.get("GITHUB_RUN_URL","")

          headers = {"Accept": "application/json", "Content-Type": "application/json"}

          # ---- Auth selection ----
          if pat:
            headers["Authorization"] = f"Bearer {pat}"
            api_ver = "2"
            is_cloud = False
          elif email and api_token:
            token = base64.b64encode(f"{email}:{api_token}".encode("utf-8")).decode("ascii")
            headers["Authorization"] = f"Basic {token}"
            api_ver = "3"
            is_cloud = True
          else:
            raise SystemExit("Missing Jira auth. Provide JIRA_PAT (DC) or JIRA_EMAIL+JIRA_API_TOKEN (Cloud).")

          issue_endpoint = f"{base_url}/rest/api/{api_ver}/issue"
          search_endpoint = f"{base_url}/rest/api/{api_ver}/search"

          def http_json(url, method="GET", payload=None):
            data = None if payload is None else json.dumps(payload).encode("utf-8")
            req = urllib.request.Request(url, data=data, method=method, headers=headers)
            with urllib.request.urlopen(req) as resp:
              body = resp.read().decode("utf-8")
              return resp.status, (json.loads(body) if body.strip() else {})

          # ---- Load Trivy ----
          with open(trivy_path, "r", encoding="utf-8") as f:
            trivy = json.load(f)

          wanted = {"CRITICAL", "HIGH"}
          results = trivy.get("Results", []) if isinstance(trivy, dict) else []

          findings = []
          for r in results:
            target = str(r.get("Target") or r.get("ArtifactName") or "").lstrip("./")
            for mc in (r.get("Misconfigurations") or []):
              sev = str(mc.get("Severity", "")).upper()
              if sev not in wanted:
                continue
              fid = mc.get("ID") or "TRIVY_UNKNOWN"
              title = (mc.get("Title") or fid).strip()
              primary = (mc.get("PrimaryURL") or "").strip()
              cause = mc.get("CauseMetadata") or {}
              ls = cause.get("StartLine")
              le = cause.get("EndLine")

              findings.append({
                "id": fid,
                "title": title,
                "severity": sev,
                "primary": primary,
                "target": target,
                "start": ls,
                "end": le,
              })

          if not findings:
            print("No CRITICAL/HIGH misconfigurations found; nothing to create/update in Jira.")
            raise SystemExit(0)

          # ---- Build a stable signature & Summary ----
          # This signature is used to FIND the same Jira issue again and update it.
          def signature(fnd):
            loc = ""
            if fnd["start"] is not None and fnd["end"] is not None:
              loc = f":{fnd['start']}-{fnd['end']}"
            elif fnd["start"] is not None:
              loc = f":{fnd['start']}"
            # stable key: ID + target + loc
            return f"TRIVY|{fnd['id']}|{fnd['target']}{loc}"

          def make_summary(fnd):
            # If you truly want the TITLE ONLY as name, replace this with: return fnd["title"]
            # But adding signature avoids duplicates and enables exact updates.
            return f"{fnd['title']} [{fnd['severity']}] ({signature(fnd)})"

          def make_description(fnd):
            # As requested: use hyperlink as description. Adding a bit of context is optional.
            link = fnd["primary"] or "(No PrimaryURL in Trivy output)"
            return (
              f"{link}\n\n"
              f"Repo: {repo}\nRef: {ref}\nCommit: {sha}\nRun: {run_url}\n"
              f"Target: {fnd['target']}\n"
            )

          # ---- Search Jira for existing issue by signature ----
          def find_existing_issue_key(sig):
            # Search in summary by signature (quoted)
            # NOTE: ~ is "contains" match.
            jql = f'project = "{project_key}" AND summary ~ "\\"{sig}\\"" ORDER BY updated DESC'
            url = search_endpoint + "?" + urllib.parse.urlencode({"jql": jql, "maxResults": 1, "fields": "key"})
            _, data = http_json(url, "GET")
            issues = data.get("issues") or []
            if issues:
              return issues[0].get("key")
            return None

          created = 0
          updated = 0

          for fnd in findings:
            sig = signature(fnd)
            summary = make_summary(fnd)
            desc_text = make_description(fnd)

            existing_key = find_existing_issue_key(sig)

            if existing_key:
              # ---- UPDATE (overwrite) ----
              if is_cloud:
                payload = {
                  "fields": {
                    "summary": summary,
                    "description": {
                      "type": "doc",
                      "version": 1,
                      "content": [
                        {"type": "paragraph", "content": [{"type": "text", "text": desc_text}]}
                      ],
                    },
                  }
                }
              else:
                payload = {"fields": {"summary": summary, "description": desc_text}}

              http_json(f"{issue_endpoint}/{existing_key}", "PUT", payload)
              print(f"Updated Jira issue: {existing_key} for {sig}")
              updated += 1
              continue

            # ---- CREATE ----
            if is_cloud:
              payload = {
                "fields": {
                  "project": {"key": project_key},
                  "issuetype": {"name": issue_type},
                  "summary": summary,
                  "description": {
                    "type": "doc",
                    "version": 1,
                    "content": [
                      {"type": "paragraph", "content": [{"type": "text", "text": desc_text}]}
                    ],
                  },
                }
              }
            else:
              payload = {
                "fields": {
                  "project": {"key": project_key},
                  "issuetype": {"name": issue_type},
                  "summary": summary,
                  "description": desc_text,
                }
              }

            _, data = http_json(issue_endpoint, "POST", payload)
            print(f"Created Jira issue: {data.get('key', '(unknown)')} for {sig}")
            created += 1

          print(f"Done. Created={created}, Updated={updated}, TotalCandidates={len(findings)}")
          PY