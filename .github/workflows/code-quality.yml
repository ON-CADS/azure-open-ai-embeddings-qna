name: Python Code Quality Checker

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev, demo ]

permissions:
  contents: read
  pull-requests: write
  actions: read
  security-events: write

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  QUALITY_THRESHOLD: "80"      
  FAIL_ON_SYNTAX_ERROR: "true"   
  CHECKOV_HIGH_WEIGHT: "8"
  CHECKOV_MED_WEIGHT: "3"

jobs:
  python_quality:
    name: Python – lint, types, security, complexity (collect outputs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install \
            flake8 flake8-bugbear flake8-builtins pep8-naming flake8-blind-except flake8-json \
            mypy bandit radon

      - name: Prepare outputs dir
        run: mkdir -p outputs

      - name: Syntax check (compile) → outputs/syntax.json
        shell: bash
        run: |
          set +e
          pyfiles=$(git ls-files '*.py' || true)
          if [ -n "$pyfiles" ]; then
            python -m py_compile $pyfiles
            status=$?
            if [ $status -eq 0 ]; then
              echo '{"passed": true}' > outputs/syntax.json
            else
              echo '{"passed": false}' > outputs/syntax.json
            fi
          else
            echo '{"passed": true, "note":"No Python files detected"}' > outputs/syntax.json
          fi

      - name: Flake8 (style, naming, exceptions) → outputs/flake8.json
        run: |
          flake8 . --format=json --tee --output-file outputs/flake8.json || true

      - name: Mypy (types) → outputs/mypy.json
        run: |
          mypy --install-types --non-interactive --error-format=json . > outputs/mypy.json || true

      - name: Bandit (security) → outputs/bandit.json
        run: |
          bandit -r . -q -x tests -f json -o outputs/bandit.json || true

      - name: Radon (complexity JSON) → outputs/radon_cc.json
        run: |
          radon cc . -j > outputs/radon_cc.json || true

      - name: Upload Python outputs
        uses: actions/upload-artifact@v4
        with:
          name: python_outputs
          path: outputs

  checkov:
    name: IaC security (Checkov) → outputs/checkov.json + SARIF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare outputs dir
        run: mkdir -p outputs

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: true
        with:
          directory: .
          quiet: true
          framework: terraform,cloudformation,kubernetes,arm,helm,serverless
          soft_fail: false
          output_format: sarif,json
          output_file_path: outputs/checkov.sarif,outputs/checkov.json

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: outputs/checkov.sarif

      - name: Upload Checkov outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov_outputs
          path: outputs

  aggregate_score:
    name: Aggregate → single JSON + Markdown, score & notify
    runs-on: ubuntu-latest
    if: always()
    needs: [python_quality, checkov]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
  
      - name: Download Python outputs
        uses: actions/download-artifact@v4
        with:
          name: python_outputs
          path: artifacts/python

      - name: Download Checkov outputs
        uses: actions/download-artifact@v4
        with:
          name: checkov_outputs
          path: artifacts/checkov

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Aggregate & score (composite action)
        id: score
        uses: ./.github/actions
        with:
          QUALITY_THRESHOLD: ${{ env.QUALITY_THRESHOLD }}
          FAIL_ON_SYNTAX_ERROR: ${{ env.FAIL_ON_SYNTAX_ERROR }}
          CHECKOV_HIGH_WEIGHT: ${{ env.CHECKOV_HIGH_WEIGHT }}
          CHECKOV_MED_WEIGHT: ${{ env.CHECKOV_MED_WEIGHT }}

      - name: Upload aggregated summary
        uses: actions/upload-artifact@v4
        with:
          name: quality_summary
          path: outputs

      - name: PR review (request changes on failure)
        if: ${{ github.event_name == 'pull_request' && steps.score.outputs.passed == 'false' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const md = fs.readFileSync('outputs/quality_summary.md', 'utf8');
            const number = context.payload.pull_request.number;
            const reviewers = (context.payload.pull_request.requested_reviewers || []).map(r => '@' + r.login);
            const body = (reviewers.length ? reviewers.join(' ') + '\n\n' : '') + md;
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
              event: 'REQUEST_CHANGES',
              body
            });

      # - name: Send failure email to commit author (push only)
      #   if: ${{ github.event_name == 'push' && steps.score.outputs.passed == 'false' && github.event.head_commit.author.email != '' && !contains(github.event.head_commit.author.email, 'noreply') }}
      #   uses: dawidd6/action-send-mail@v3
      #   with:
      #     server_address: ${{ secrets.SMTP_SERVER }}
      #     server_port: ${{ secrets.SMTP_PORT }}
      #     username: ${{ secrets.SMTP_USERNAME }}
      #     password: ${{ secrets.SMTP_PASSWORD }}
      #     subject: "[${{ github.repository }}] Code Quality FAILED (score ${{ steps.score.outputs.score }}) on ${{ github.ref_name }}"
      #     to: ${{ github.event.head_commit.author.email }}
      #     from: ${{ secrets.SMTP_FROM }}
      #     html_body: |
      #       <p>Hi,</p>
      #       <p>Your recent push to <b>${{ github.ref_name }}</b> failed the code quality gate.</p>
      #       <p><b>Score:</b> ${{ steps.score.outputs.score }} (required: ${{ steps.score.outputs.threshold }})</p>
      #       <p>See full report in the workflow run artifacts (quality_summary) and the job summary.</p>
      #       <p>Repository: <a href="https://github.com/${{ github.repository }}b.repository }}</a></p>

      - name: Fail if below threshold
        if: ${{ steps.score.outputs.passed == 'false' }}
        run: |
          echo "Quality score ${{ steps.score.outputs.score }} is below threshold ${{ steps.score.outputs.threshold }}."
          exit 1

  